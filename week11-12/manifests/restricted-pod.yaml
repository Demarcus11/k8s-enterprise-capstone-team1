apiVersion: v1
kind: Pod
metadata:
  name: secure-pod
  namespace: dev
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: secure
      image: nginxinc/nginx-unprivileged:alpine
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL

            
##THIS IS THE NONCOMPLIANT POD EXAMPLE
#### This pod will be rejected by the PodSecurity admission controller because it is privileged and uses a hostPath volume, which are not allowed in the "restricted" policy level.
