apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: dev
  name: pod-reader
rules:
- apiGroups: [""] # "" indicates the core API group
  resources: ["pods"] # Specify the resource you want to grant access to
  verbs: ["get", "list"] # Specify the actions you want to allow (e.g., get, list, watch)