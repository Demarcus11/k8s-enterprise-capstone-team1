name: CI Pipeline

# Trigger pipeline on PR merge to main
on:
  push:
    branches: 
      - main

jobs:
  ci-cd-pipeline:
    runs-on: ubuntu-latest

    steps:
      # Step 0 Checkout code
      - uses: actions/checkout@v3

      # Step 1 Validate YAML
      - name: Validate helm YAML
        run: helm lint ./solutions/helm/sample-app

      # Step 2 Mock Build
      - name: Build container image (mock)
        run: |
          echo "Building your container image..."
          echo "Building image sample-app:latest..."
          echo "Container image built successfully!"
          echo "Mock build complete."

      # Step 3 Deploy to Kubernetes
      - name: Deploy to Kubernetes using Helm
        run: |
          echo "Deploying to Kubernetes using Helm..."
          helm upgrade --install sample-app ./solutions/helm/sample-app
