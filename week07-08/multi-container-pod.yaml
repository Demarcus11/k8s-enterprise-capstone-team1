apiVersion: v1
kind: Pod
metadata:
  name: multi-container-demo
  labels:
    app: multi-container-demo
spec:
  containers:
  - name: main-app
    image: nginx:1.27
    ports:
      - containerPort: 80
    volumeMounts:
      - name: shared-data
        mountPath: /usr/share/nginx/html

  - name: sidecar
    image: busybox
    command: ["sh", "-c", "while true; do echo 'Hello from sidecar' >> /data/index.html; sleep 5; done"]
    volumeMounts:
      - name: shared-data
        mountPath: /data

  volumes:
    - name: shared-data
      emptyDir: {}