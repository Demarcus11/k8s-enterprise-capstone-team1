apiVersion: v1
kind: Pod
metadata:
  name: sidecar-demo
spec:
  # shared storage for both containers
  volumes:
    - name: shared-data
      emptyDir: {}
      
  containers:
    # main app container
    - name: app
      image: nginx:1.28
      command: ["/bin/sh"]
      args:
        - "-c"
        - |
          echo "Hello from NGINX $(hostname)" > /usr/share/nginx/html/index.html;
          nginx -g 'daemon off;'
      volumeMounts:
        - name: shared-data
          mountPath: /usr/share/nginx/html
    # sidecar container
    - name: sidecar
      image: busybox
      command: ["/bin/sh"]
      args:
        - "-c"
        - |
          echo "Sidecar started...";
          while true; do
            if [ -f /data/index.html ]; then
              echo "---- File Content ----";
              cat /data/index.html;
            fi;
            sleep 5;
          done
      volumeMounts:
        - name: shared-data
          mountPath: /data
