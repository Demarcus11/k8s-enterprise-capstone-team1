name: CI Pipeline

on:
  push:
    branches: ["**"] # This runs on a push to ANY branch
  workflow_dispatch: # This still lets you run it manually via the button

jobs:
  ci-cd-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # 1. Validate YAML
      - name: Validate YAML
        run: helm lint week07-08/solutions/helm/sample-app

      # 2. Build (Mock)
      - name: Build container image (mock)
        run: |
          echo "Building container image..."
          echo "Simulating image build for sample-app:latest..."

      # 3. Scan Image
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "nginx:latest"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      # 4. Deploy to Kubernetes
      - name: Deploy to Kubernetes using Helm
        run: |
          echo "Deploying to Kubernetes using Helm..."
          # Note: This will run in the GitHub runner, not your local cluster
          # unless you have a Kubeconfig secret set up!
