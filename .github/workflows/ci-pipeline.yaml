name: CI Pipeline

on:
  push:
    branches:
      - week09-10-Alex
  pull_request:
    types: [closed]
    branches: [week07-08-Alex]

jobs:
  # Validates YAML.
  validate-yaml:
    name: Validate YAML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install kubeval
        run: |
          wget https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
          tar xf kubeval-linux-amd64.tar.gz
          sudo mv kubeval /usr/local/bin/

      - name: Validate manifests
        run: kubeval --schema-location https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/ week07-08/manifests/*.yaml

      - name: Helm lint
        run: helm lint ./week07-08/solutions/helm/sample-app

  # Scans container image for vulnerabilities using Trivy.
  trivy-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    needs: validate-yaml
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nginx:latest
          format: table
          exit-code: '1'            # Fail pipeline on vulnerabilities found
          severity: 'CRITICAL,HIGH' # Only fail on CRITICAL or HIGH
          ignore-unfixed: True 
          # True will let unfixed vulnerabilities pass; otherwise the pipeline fails. 
          # For the sake of subsequent labs Post Week09-10, Lab 3, this is true so that we don't have lingering pipeline fails from old lab submissions.

  # Builds container image using a mock build (not actual container).
  build-image:
    name: Build Container Image
    runs-on: ubuntu-latest
    needs: trivy-scan             # Won't build if Trivy scan fails
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Mock build
        run: |
          echo "Building container image..."
          echo "Simulating image build for sample-app:latest..."
          echo "Image build complete."

  # Deploys to Kubernetes using Helm.
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Helm
        run: curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Mock deploy
        run: |
          echo "Deploying to Kubernetes using Helm..."
          helm template sample-app ./week07-08/solutions/helm/sample-app
          echo "Deploy complete."