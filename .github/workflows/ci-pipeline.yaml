name: CI Pipeline

# Trigger pipeline on PR merge to main
on:
  push:
    branches: [week09-10-Joseph]
  pull_request:
    types: [closed]
    branches: [week09-10-Joseph]

jobs:
  ci-cd-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Validate YAML
      - name: Validate YAML
        run: helm lint ./week07-08/solutions/sample-app

      # Build (Mock)
      - name: Build container image (mock)
        run: |
          echo "Building container image..."
          echo "Simulating image build for sample-app:latest..."
          echo "Image build complete."

      # Image Scan using Trivy
      - name: Run Trivy Image Scan
        run: |
          echo "Scanning Nginx image for vulnerabilities..."
          docker run ghcr.io/aquasecurity/trivy image --severity HIGH,CRITICAL nginx:latest

      # Force Deployment Standards
      - name: Validate Kubernetes Manifests
        run: |
          echo "Scanning manifests in week09-10/manifests for policy violations..."
          docker run -v ${{ github.workspace }}:/apps ghcr.io/aquasecurity/trivy config /apps/week09-10/manifests \
            --severity HIGH,CRITICAL \
            --exit-code 1

      # Deploy to Kubernetes
      - name: Deploy to Kubernetes using Helm
        run: |
          echo "Deploying to Kubernetes using Helm..."
          helm upgrade --install sample-app ./week07-08/solutions/sample-app
