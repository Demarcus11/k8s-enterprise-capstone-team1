apiVersion: apps/v1
kind: Deployment
metadata:
  name: stateless-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stateless-app-deployment
  template:
    metadata:
      labels:
        app: stateless-app-deployment
    spec:
      containers:
      - name: app
        image: nginx:1.27
        ports:
        - containerPort: 80