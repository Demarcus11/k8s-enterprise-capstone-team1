apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-oom-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resource-oom-demo
  template:
    metadata:
      labels:
        app: resource-oom-demo
    spec:
      containers:
      - name: stress
        image: polinux/stress
        resources:
          limits:
            memory: "128Mi"
        command: ["stress"]
        args: ["--vm", "1", "--vm-bytes", "300M", "--vm-hang", "1"]