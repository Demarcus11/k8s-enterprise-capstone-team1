apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab01-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab01-app
  template:
    metadata:
      labels:
        app: lab01-app
    spec:
      containers:
      - name: app
        image: nginx
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "32Mi"
