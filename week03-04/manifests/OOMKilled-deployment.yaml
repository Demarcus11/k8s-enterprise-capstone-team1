apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-killed-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oom-killed-deployment
  template:
    metadata:
      labels:
        app: oom-killed-deployment
    spec:
      containers:
      - name: app
        # Reference: Stressing a Kubernetes Pod to Induce an OOMKilled Error (https://medium.com/@bm54cloud/stressing-a-kubernetes-pod-to-induce-an-oomkilled-error-96f3be9c931d)
        # Container is created from the polinux/stress image which is commonly utilized for stress testing
        image: polinux/stress
        # Stress command
        command: ["stress"]
        # Arguments for the stress command in order to create a single virtual memory worklaod of 512MB; hangs for 1 second
        args: ["--vm", "1", "--vm-bytes", "512M", "--vm-hang", "1"]
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"