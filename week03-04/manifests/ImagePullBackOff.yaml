apiVersion: apps/v1
kind: Deployment
metadata:
  name: imagepull-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: imagepull-demo
  template:
    metadata:
      labels:
        app: imagepull-demo
    spec:
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"

      - key: "dedicated"
        operator: "Equal"
        value: "experimental"
        effect: "NoSchedule"

      - key: "test"
        operator: "Equal"
        value: "noschedule"
        effect: "NoSchedule"
      containers:
      - name: badimage
        #image: nginx:notarealtag
        image: nginx:1.27