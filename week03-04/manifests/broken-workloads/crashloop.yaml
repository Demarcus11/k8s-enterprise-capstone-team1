apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crashloop-demo
  template:
    metadata:
      labels:
        app: crashloop-demo
    spec:
      containers:
      - name: app
        image: nginx
        command: ["/bin/false"] # A Linux utility that does nothing and exists with a non-zero status code (Source: https://www.baeldung.com/linux/bin-true-bin-false-commands)