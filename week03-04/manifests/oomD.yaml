apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      containers:
      - name: sample-app
        image: nginx:1.27
        resources:
          requests:
            memory: "32Mi"
            cpu: "250m"
          limits:
            memory: "64Mi"
            cpu: "500m"
        #create an OOM by using more memory than the limit
        args: ["--vm", "1", "--vm-bytes", "128M", "--vm-hang", "1"]
        ports:
        - containerPort: 80