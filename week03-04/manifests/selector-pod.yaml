apiVersion: v1
kind: Pod
metadata:
  name: selector-pod
spec:
  nodeSelector:
    dedicated: experimental

  tolerations:
  - key: "test"
    operator: "Equal"
    value: "noschedule"
    effect: "NoSchedule"
    
  - key: "dedicated"
    operator: "Equal"
    value: "experimental"
    effect: "NoSchedule"

  containers:
  - name: nginx
    image: nginx:1.27