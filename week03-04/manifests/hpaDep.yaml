apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resource-demo
  template:
    metadata:
      labels:
        app: resource-demo
    spec:
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"

        - key: "dedicated"
          operator: "Equal"
          value: "experimental"
          effect: "NoSchedule"

        - key: "test"
          operator: "Equal"
          value: "noschedule"
          effect: "NoSchedule"
      containers:
      - name: cpu-demo
        image: polinux/stress
        args:
        - "--cpu"
        - "1"
        - "--timeout"
        - "600s"
        resources:
          requests:
            cpu: "100m"
          limits:
            cpu: "500m"
