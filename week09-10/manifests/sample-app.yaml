apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      containers:
        - name: sample-app
          image: nginx:1.27
          ports:
            - containerPort: 80
          # Secret as environment variable
          env:
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret # name of the secret
                  key: PASSWORD # key of the secret
          # Secret mounted as a volume
          volumeMounts:
            - name: secrets
              mountPath: "/etc/secrets"
              readOnly: true
      volumes:
        - name: secrets
          secret:
            secretName: app-secret
