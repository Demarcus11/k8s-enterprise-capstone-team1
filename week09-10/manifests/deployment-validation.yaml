apiVersion: apps/v1
kind: Deployment
metadata:
  name: validation-app
  namespace: dev
spec:
  replicas: 3
  selector:
    matchLabels:
      app: validation-app
  template:
    metadata:
      labels:
        app: validation-app
    spec:
      containers:
      - name: validation-container
        image: nginx:1.27
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "250m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
        readinessProbe:
          httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
