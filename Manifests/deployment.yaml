apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      containers:
        - name: sample-app
          image: nginx:1.27
          # keeps adding a's, so the variable 'x' uses more RAM
          command: ["/bin/sh", "-c", "x='a'; while true; do x=$x$x; done"]
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "5Mi"
              cpu: "100m"
            limits:
              memory: "5Mi"
              cpu: "200m"
